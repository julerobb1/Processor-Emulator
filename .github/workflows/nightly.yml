name: Nightly Build

on:
  schedule:
    - cron: '0 6 * * *'  # Run at 6 AM UTC daily
  workflow_dispatch:     # Allow manual trigger

jobs:
  nightly:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        ref: dev
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 6.0.x
        
    - name: Restore dependencies
      run: dotnet restore ProcessorEmulator.csproj
      
    - name: Build
      run: dotnet build ProcessorEmulator.csproj --no-restore --configuration Debug
      
    - name: Test
      run: dotnet test ProcessorEmulator.csproj --no-build --configuration Debug --verbosity normal
      
    - name: Publish Nightly
      run: dotnet publish ProcessorEmulator.csproj --configuration Debug --output ./nightly-build
      
    - name: Upload Nightly Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: nightly-build-${{ github.run_number }}
        path: ./nightly-build
