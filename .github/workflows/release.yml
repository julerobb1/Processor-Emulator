name: "Release on Tag"

on:
  push:
    # Trigger on git tags, e.g. v1.2.3
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # Development build job: produces a dev artifact with its own identifier
  dev-build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup .NET 6 SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '6.0.x'
      - name: Build Dev (Debug)
        run: |
          dotnet restore
          dotnet build ProcessorEmulator.csproj --configuration Debug
          dotnet publish ProcessorEmulator.csproj --configuration Debug --output dev-artifacts
      - name: Upload Dev Artifact
        uses: actions/upload-artifact@v3
        with:
          name: dev-build-${{ github.run_number }}
          path: dev-artifacts

  build-and-release:
    needs: dev-build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 6 SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '6.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v3
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build solution
        run: |
          dotnet restore
          dotnet build ProcessorEmulator.csproj --configuration Release

      - name: Publish artifacts
        run: |
          dotnet publish ProcessorEmulator.csproj --configuration Release --output artifacts

      # Release publish lives in auto-release.yml. This workflow
      # only builds and uploads the job artifact when a v* tag
      # is pushed (including the tag auto-release.yml just made).
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProcessorEmulator-${{ github.ref_name }}
          path: artifacts
