name: Nightly Build

on:
  schedule:
    # every day at midnight UTC
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  nightly:
    name: Nightly Dev Build
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore dependencies
        run: dotnet restore ProcessorEmulator.csproj

      - name: Build and Test (Debug)
        run: |
          dotnet build ProcessorEmulator.csproj --configuration Debug --no-restore
          dotnet test ProcessorEmulator.csproj --configuration Debug --no-build --verbosity normal

      - name: Publish Nightly Artifacts
        run: dotnet publish ProcessorEmulator.csproj --configuration Debug --output ./nightly-build

      - name: Upload Nightly Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: nightly-build-${{ github.run_number }}
          path: ./nightly-build
