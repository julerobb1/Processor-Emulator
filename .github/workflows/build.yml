name: Production Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        
    - name: Restore dependencies
      run: dotnet restore ProcessorEmulator.csproj
      
    - name: Build
      run: dotnet build ProcessorEmulator.csproj --no-restore --configuration Release
      
    - name: Test
      run: dotnet test ProcessorEmulator.csproj --no-build --configuration Release --verbosity normal
      
    # GitHub Releases are created by auto-release.yml on merge to
    # main/dev. Do not create a second release when that workflow
    # pushes the new v* tag.
